global 
  log 127.0.0.1:514 local0 
  user haproxy
  group haproxy
  daemon
  maxconn 80000
  tune.bufsize 32768
  tune.ssl.default-dh-param 2048

frontend status-monitor
  bind *:8080
  mode http
  maxconn 10
  stats enable
  stats refresh 300s
  stats show-legends
  stats show-node
  stats show-modules
  stats realm Haproxy\ Statistics
  stats uri /
  monitor-uri /checkstatus
  stats auth lumi:lum!onRock
default_backend empty_backend_nodes

defaults tcp_defaults
  log global
  mode tcp
  maxconn 10000
  timeout client-fin 5s
  timeout server-fin 5s
  retries 3
  option redispatch
  timeout connect 10s
  timeout client 5m
  timeout server 5m
  timeout tunnel        3600s
  timeout http-keep-alive  1s
  timeout http-request    15s
  timeout queue           30s
  timeout tarpit          60s
  ##load-server-state-from-file global

defaults http_defaults
  log global
  mode http
  balance source
  maxconn 10000
  #option forwardfor
  option httpchk
  timeout connect 10s
  timeout client 5m
  timeout server 5m
  timeout http-keep-alive 1s
  timeout http-request 15s
  timeout queue 30s
  http-check expect status 200 #200-399
