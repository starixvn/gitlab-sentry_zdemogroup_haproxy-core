  http-check send meth GET uri /sit/game-client-64/ hdr Host "l1uatcli.foodpandaoh.net"
  #server cluster_kbt_uat l1uatcli.foodpandaoh.net:80 check #KBT
  #server cluster_aws_uat 10.77.15.173:80 check inter 5s fall 3 rise 3 #AWS
  server cluster_aws_eks a278ade9381e14c0aa7b4b6ed158cefa-d82041eb6e29b5b0.elb.ap-northeast-1.amazonaws.com:80 check inter 2s fall 2 rise 3

