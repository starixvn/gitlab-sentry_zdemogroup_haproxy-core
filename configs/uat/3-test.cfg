backend test_l1_appdownload_uat_be from http_defaults
  option log-health-checks
  http-request set-header Host l1uatdl.foodpandaoh.net
  http-check send meth GET uri / hdr Host "l1uatdl.foodpandaoh.net"
  server cluster_kbt l1uatdl.foodpandaoh.net:80 check #DirectConnect
  server cluster_aws 10.77.15.5:80 check #AWS

backend test_l1_appdownload_sit_be from http_defaults
  #option log-health-checks
  #option httpchk GET /
  #http-request set-header Host l1sitdl.foodpandaoh.net
  http-check send meth GET uri / hdr Host "l1sitdl.foodpandaoh.net"
  http-check expect status 200
  server cluster_kbt l1sitdl.foodpandaoh.net:80 check #DirectConnect
  server cluster_aws 10.77.15.5:80 check #AWS

backend test_l1_instant_client_sit_be from http_defaults
  #http-request set-header Host l1minisit.foodpandaoh.net
  #option httpchk GET /
  http-check send meth GET uri / hdr Host "l1minisit.foodpandaoh.net:8080"
  http-check expect status 200
  server cluster_kbt_uat l1minisit.foodpandaoh.net:80 check #KBT
  server cluster_aws_sit 10.77.15.5:80 check #AWS

