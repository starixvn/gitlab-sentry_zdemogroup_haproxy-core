backend test_l1_site1_be from http_defaults
  option log-health-checks
  http-check connect default proto h1
  option httpchk GET /health HTTP/1.1
  http-request set-header Host l1uatdl.foodpandaoh.net
  server cluster_kbt l1uatdl.foodpandaoh.net:80 check #DirectConnect
  server cluster_aws 10.77.15.5:8088 check #AWS

backend test_l1_appdownload_uat_be from http_defaults
  option log-health-checks
  http-check connect default proto h1
  option httpchk GET /health HTTP/1.1
  http-request set-header Host l1uatdl.foodpandaoh.net
  http-check send meth GET uri / hdr Host "l1uatdl.foodpandaoh.net"
  server cluster_kbt l1uatdl.foodpandaoh.net:80 check #DirectConnect
  server cluster_aws 10.77.15.5:8088 check #AWS
##############
backend empty_backend_nodes from http_defaults
  http-request return status 200 content-type "text/plain"  lf-string "UAT Proxy GW - healthy"
