#UAT
backend gn_game_client_uat_be from http_defaults
  http-request set-header Host gnuat.foodpandaoh.net
  http-check send meth GET uri / hdr Host "gnuat.foodpandaoh.net"
  server cluster_kbt_uat gnuat.foodpandaoh.net:80 check #KBT
  server cluster_aws_eks a278ade9381e14c0aa7b4b6ed158cefa-d82041eb6e29b5b0.elb.ap-northeast-1.amazonaws.com:80 check inter 2s fall 2 rise 3

