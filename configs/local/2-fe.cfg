frontend cluster_fe from http_defaults
  bind *:80
  bind *:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
  #option dontlog-normal
  option forwardfor
  option httplog
  monitor-uri /checkstatus
  http-request redirect scheme https unless { ssl_fc }
  capture request header Host len 30
  capture request header User-Agent len 200
  capture request header Referer len 800
  capture request header X-Forwarded-For len 20
  option http-keep-alive

  acl argocd_site hdr_dom(host) -i argocd-local-1.lumigame.com
  use_backend argocd_site_be if argocd_site
  use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-proxy-domain.map)] if { hdr(host) -i l1-client.lumigame.com }
  use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-services-domain.map)] if { hdr(host) -i l1-services.lumigame.com }
  use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]
default_backend backend_ingress

backend default_backend_nodes from http_defaults
  mode http
  http-request return status 503 content-type "text/plain" lf-string "503 Service Unavailable ! Pls contact NexOps if you think this is a mistake...AWS - Proxy GW"
