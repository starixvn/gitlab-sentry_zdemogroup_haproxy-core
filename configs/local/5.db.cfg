
###########DB1
frontend db1_sc_fe
    bind *:17101 
    mode tcp
    default_backend db1_sc_be

backend db1_sc_be
    mode tcp
    option tcp-check
    server 10.10.50.12_17101 10.10.50.12:17101 check 

###########DB2
