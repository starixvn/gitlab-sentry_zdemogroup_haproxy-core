################### K8s API
frontend kubernetes-frontend
  bind *:6443
  mode tcp
  option tcplog
  default_backend kubernetes-backend


backend kubernetes-backend
  option httpchk GET /healthz
  http-check expect status 200
  mode tcp
  option ssl-hello-chk
  balance roundrobin
  server master2 10.10.50.54:6443 check fall 3 rise 2
  server master3 10.10.50.80:6443 check fall 3 rise 2
  server master4 10.10.50.45:6443 check fall 3 rise 2


frontend portainer-frontend from tcp_defaults
  bind *:9001
  default_backend portainer-backend

backend portainer-backend from tcp_defaults
  server worker1 10.10.50.46:30778 check fall 3 rise 2
  server worker2 10.10.50.47:30778 check fall 3 rise 2
  server worker3 10.10.50.60:30778 check fall 3 rise 2


frontend prometheus-k8s-local from http_defaults
  bind *:30062
  default_backend prometheus-k8s-local-be

backend prometheus-k8s-local-be
  option httpchk HEAD /-/healthy
  server worker1 10.10.50.60:30062 check fall 3 rise 2
  server worker2 10.10.50.46:30062 check fall 3 rise 2
  server worker3 10.10.50.47:30062 check fall 3 rise 2




backend backend_ingress
  mode    http
  option forwardfor
  server  worker1 10.10.50.46:31080
  server  worker2 10.10.50.47:31080
  server  worker3 10.10.50.60:31080

backend backend_ingress_stat
  mode    http
  server  worker1 10.10.50.60:31024

backend argocd_site_be
  mode    http
  cookie  SRVNAME insert indirect nocache
  server  worker1 10.10.50.60:30316 weight 1 check inter 2000


backend hub_site_main_be from http_defaults
  timeout server 10m
  http-check send meth GET uri /api/v2.0/systeminfo hdr Host "hub.lumigame.com"
  server hub_main 10.10.50.33:5055 check
  server hub_bk 10.10.50.34:5055 check backup

backend hub_site_old_main_be from http_defaults
  timeout server 10m
  http-check send meth GET uri /api/v2.0/systeminfo hdr Host "hub-old.lumigame.com"
  server hub_main 10.10.50.33:5055 check
  #server hub_bk 10.10.50.34:5055 check backup

backend portainer_server_be from http_defaults
  http-check send meth GET uri / hdr Host "portainer-k8s.lumigame.com"
  server worker1 10.10.50.46:30777 check
  server worker2 10.10.50.47:30777 check
  server worker3 10.10.50.60:30777 check

backend logs_new_be
  mode http
  server kibana_server 10.10.50.60:30536 

backend weavescope_be
  mode http
  server weavescope_fe 10.10.50.60:30977

backend hub_site_k8s_be
  mode http
  server worker 10.10.50.60:30002 #check

