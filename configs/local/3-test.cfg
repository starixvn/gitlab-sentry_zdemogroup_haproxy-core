backend site1_be from http_defaults
  http-check send meth GET uri / hdr Host "t1.sb33.site"
  http-request set-header X-Forwarded-Port %[dst_port]
  http-request add-header X-Forwarded-Proto https if { ssl_fc }
  server cluster_sc_69 10.10.50.69:8088 check inter 500 downinter 2s fall 2 rise 3
  server cluster_sg_96 10.10.50.96:8088 check inter 500 downinter 2s fall 2 rise 3
  server cluster_aws 10.0.1.41:8088 check inter 500 downinter 2s fall 2 rise 3
################
backend default_backend_nodes
  mode http
  http-request return status 503 content-type "text/plain" lf-string "503 Service Unavailable ! Pls contact NexOps if you think this is a mistake..."

backend empty_backend_nodes
  http-request return status 200 content-type "text/plain"  lf-string "I'm ok. LOCAL"
