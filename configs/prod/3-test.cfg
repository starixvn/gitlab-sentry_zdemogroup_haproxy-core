backend site1_be from http_defaults
  http-check send meth GET uri / hdr Host "prod-sc-web1.sportsfun.app"
  server cluster_prod sc-prod-c.foodpandaoh.net:80 check
  server cluster_aws 10.77.15.10:8088 check #AWS

backend nexops_deploymentapi_new_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    server-template nexops_deployment_api_ 5 nexops_deployment_api:22222 check resolvers docker init-addr none

backend nexops_backend_for_testing_fe
