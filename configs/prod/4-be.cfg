#
backend l1_appdownload_prod_be from http_defaults
  http-request set-header Host sc-dl.foodpandaoh.net
  http-check send meth GET uri / hdr Host "sc-dl.foodpandaoh.net"
  server cluster_kbt sc-dl.foodpandaoh.net:80 check #KBT
  server cluster_aws 10.77.15.10:80 check inter 5s fall 3 rise 3 #AWS

backend l1_keno_prod_be from http_defaults
  http-request set-header Host sc-keno.foodpandaoh.net
  http-check send meth GET uri /favicon-l1.ico hdr Host "sc-keno.foodpandaoh.net"
  server cluster_kbt sc-keno.foodpandaoh.net:80 check weight 50 #KBT
  server cluster_aws_1 10.77.15.10:80 check inter 5s fall 3 rise 3 weight 25
  server cluster_aws_2 10.77.15.11:80 check inter 5s fall 3 rise 3 weight 25

