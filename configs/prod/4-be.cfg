#
backend l1_appdownload_prod_be from http_defaults
  http-check send meth GET uri / hdr Host "taisaba.com"
  server cluster_kbt sc-prod-c.foodpandaoh.net:80 check #KBT sc-uat-c.foodpandaoh.net:80
  server cluster_aws 10.77.15.10:80 check inter 5s fall 3 rise 3 #AWS

backend l1_keno_prod_be from http_defaults
  http-check send meth GET uri /favicon-l1.ico hdr Host "keno.sabagame.com"
  server cluster_kbt sc-prod-c.foodpandaoh.net:80 check weight 50 #KBT
  server cluster_aws 10.77.15.10:80 check inter 5s fall 3 rise 3 weight 50 #AWS

