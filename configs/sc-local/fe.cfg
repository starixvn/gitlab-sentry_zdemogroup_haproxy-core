frontend cluster_fe
  bind *:80
  bind *:443 ssl crt /etc/haproxy/lumigame.com.pem alpn h2,http/1.1
  mode http
  option forwardfor
  option httplog
  capture request header Host len 30
  capture request header User-Agent len 200
  capture request header Referer len 800
  capture request header X-Forwarded-For len 20
  option http-keep-alive
  #http-request set-var(txn.request_host_header) req.hdr(Host)
  use_backend %[path,lower,map_reg(/etc/haproxy/maps/l1-proxy-domain.map)] if { hdr(host) -i l1-client.lumigame.com }
  use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map)]

default_backend default_backend_nodes

backend game_client_48_be from http_defaults
  http-check send meth GET uri /game-client-48/health hdr Host "l1-client.lumigame.com"
  server cluster_sc_69 10.10.50.69:8088 check
  server cluster_sg_96 10.10.50.96:8088 check

backend site_67_be from http_defaults
  http-check send meth GET uri /site-67/health hdr Host "l1-client.lumigame.com"
  server cluster_sc_69 10.10.50.69:8088 check
  server cluster_sg_96 10.10.50.96:8088 check

backend l1_appdownload_be from http_defaults
